name: Build & Push Pre-built Image
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/images/**"
  schedule:
    # Rebuild weekly on Monday at 03:00 UTC to pick up latest tool versions
    - cron: "0 3 * * 1"
  release:
    types: [published]

permissions:
  packages: write
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/talxis/tools-agentbox/image
  DOCKERFILE: src/images/power-platform/Dockerfile

jobs:
  # Cutting a GitHub Release (tag vX.Y.Z) is the only way to get a real, pinnable version
  # tag on the image - same convention as tools-devkit-build/tools-devkit-templates. Every
  # other trigger (push/schedule/workflow_dispatch) only ever refreshes `latest`. This is a dev
  # tool, not something needing reproducible pinned builds, so no sha/date tags accumulate history
  # nobody asked for — see the cleanup step in the merge job below.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag '$tag'. Expected vX.Y.Z." >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - id: slug
        run: echo "value=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          # Forces the toolchain layer (install-features.sh) to actually re-run every build instead
          # of silently reusing a stale cached layer — most Feature versions resolve to "latest",
          # and the cache below is keyed on instruction text, not on what a re-run would fetch.
          build-args: CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ steps.slug.outputs.value }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.value }},mode=max
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        id: build

      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build, resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.resolve-version.outputs.version }},enable=${{ needs.resolve-version.outputs.version != '' }}

      - run: |
          cd /tmp/digests
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # No sha/date tags means the digest `latest` used to point to becomes untagged the moment it
      # moves — prune those on every build so old, unreferenced versions never pile up.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: tools-agentbox/image
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 1
          token: ${{ secrets.GITHUB_TOKEN }}
