name: docs
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/container/features/**"
      - "src/container/templates/**"

# Keeps the generated README.md of each Feature and Template in sync with its manifest by opening a
# PR. Not a publish - nothing reaches GHCR here; that's publish.yaml, on a release.
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The generator builds each README's usage example (".../<id>:1") from the manifest's major
      # version, and the repo's manifests carry a 0.0.1 placeholder. Use the latest release's version
      # instead, as publish.yaml does; only README.md files are committed below.
      - name: Set the latest release version in every Feature and Template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(gh release view --json tagName -q .tagName)"
          version="${version#v}"
          for f in src/container/features/*/devcontainer-feature.json src/container/templates/*/devcontainer-template.json; do
            jq --arg v "$version" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      # Two invocations: devcontainers/action refuses Features and Templates in one.
      - name: Generate Feature documentation
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1
        with:
          base-path-to-features: "./src/container/features"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Template documentation
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1
        with:
          base-path-to-templates: "./src/container/templates"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR for Documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config pull.rebase false

          branch="automated-docs-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          message="Automated documentation update"

          git add src/container/features/**/README.md src/container/templates/**/README.md 2>/dev/null || true
          git commit -m "Automated documentation update [skip ci]" || export NO_UPDATES=true

          if [ "$NO_UPDATES" != "true" ]; then
            git push origin "$branch"
            gh pr create --title "$message" --body "$message"
          fi
