name: "Copilot Setup Steps"

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install the agentbox toolchain
        run: |
          sudo bash src/claude-code/setup.sh
          sudo chmod o+x /root
          sudo chmod -R o+rX /root/.dotnet /usr/local/dotnet 2>/dev/null || true
