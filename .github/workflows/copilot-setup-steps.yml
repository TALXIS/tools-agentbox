name: "Copilot Setup Steps"

# Prepares the GitHub Copilot cloud agent's runner. Here it runs this checkout's setup script; other
# repositories use `curl -fsSL https://talxis.com/agentbox-setup | bash` instead (see the README).
on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up AgentBox
        run: bash src/container/scripts/install-features.sh
