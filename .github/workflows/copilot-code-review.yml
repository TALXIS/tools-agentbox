name: "Copilot Code Review Setup"

# Copilot code review falls back to copilot-setup-steps.yml when this file is
# absent. A review only reads the diff and doesn't need the AgentBox tools, so it
# gets its own minimal setup.
on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
