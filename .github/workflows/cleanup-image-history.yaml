name: One-off cleanup - purge old image versions
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE" to confirm — this permanently deletes every version of ghcr.io/talxis/tools-agentbox/image except `latest` and semver release tags.'
        required: true

# Manual, occasional-use tool — not something that runs on a schedule. The routine cleanup that
# runs on every publish lives in publish-image.yaml itself (untagged versions only); this one also
# removes old sha/date tags accumulated before that started, since this is a dev tool with no need
# for reproducible pinned history.
jobs:
  purge:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: tools-agentbox/image
          package-type: container
          min-versions-to-keep: 0
          ignore-versions: '^(latest|\d+\.\d+\.\d+)$'
          token: ${{ secrets.GITHUB_TOKEN }}
