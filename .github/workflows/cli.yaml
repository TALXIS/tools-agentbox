name: "CI - agentbox CLI"
on:
  pull_request:
    paths:
      - "src/cli/**"
      - "test/cli/**"
      - "src/container/templates/power-platform/.devcontainer/devcontainer.features.json"
      - ".github/workflows/cli.yaml"
  push:
    branches: [master]
    paths:
      - "src/cli/**"
      - "test/cli/**"
      - "src/container/templates/power-platform/.devcontainer/devcontainer.features.json"
      - ".github/workflows/cli.yaml"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Linux is what AgentBox runs on; the unit tests cover the checks a person runs elsewhere.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test src/cli --configuration Release

  # Pull requests only: a merge to master has already been through them.
  pack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - id: pack
        run: |
          version="0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}"
          src/cli/build/pack.sh "$version" nupkg
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: agentbox-nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 3

  # The packed tool in containers, the way it will be used: a bare Linux container as root, another
  # vendor's devcontainer image as its non-root user (sudo), and the published AgentBox image with
  # outdated tools (the lab's "update without restarting" instruction).
  container:
    needs: [pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: container
            image: ubuntu:24.04
            user: root
          # Pinned to 24.04 like the AgentBox image: "ubuntu" moves to new releases before
          # every upstream Feature supports them.
          - scenario: foreign-image
            image: mcr.microsoft.com/devcontainers/base:noble
            user: vscode
          - scenario: lab-update
            image: ghcr.io/talxis/tools-agentbox/image:latest
            user: root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agentbox-nupkg
          path: nupkg
      - name: ${{ matrix.scenario }}
        run: |
          docker run --rm --user "${{ matrix.user }}" \
            -e AGENTBOX_VERSION="${{ needs.pack.outputs.version }}" \
            -v "$PWD/nupkg:/nupkg:ro" -v "$PWD/test/cli:/ci:ro" \
            "${{ matrix.image }}" bash "/ci/${{ matrix.scenario }}.sh"
