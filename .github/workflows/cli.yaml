name: "CI - agentbox CLI"
on:
  pull_request:
    paths:
      - "src/cli/**"
      - "test/cli/**"
      - "src/container/scripts/**"
      - "src/container/features/**"
      - "src/container/templates/power-platform/.devcontainer/devcontainer.features.json"
      - ".github/workflows/cli.yaml"
  push:
    branches: [master]
    paths:
      - "src/cli/**"
      - "test/cli/**"
      - "src/container/scripts/**"
      - "src/container/features/**"
      - "src/container/templates/power-platform/.devcontainer/devcontainer.features.json"
      - ".github/workflows/cli.yaml"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Unit tests, and the checks a person runs on their own machine, on every OS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet test src/cli --configuration Release

      - name: prerequisite list
        run: |
          dotnet build src/cli/TALXIS.AgentBox.CLI --configuration Release --nologo -v q
          AGENTBOX="$PWD/src/cli/TALXIS.AgentBox.CLI/bin/Release/net10.0/TALXIS.AgentBox.CLI.dll"
          echo "AGENTBOX=$AGENTBOX" >> "$GITHUB_ENV"
          dotnet "$AGENTBOX" prerequisite list --format json

      - name: validate and install change nothing on a workstation
        env:
          # GITHUB_ACTIONS=true would make it treat the runner as a disposable container.
          AGENTBOX_CONTAINER: "false"
        run: |
          # Exit 3 means something is missing, which is fine here; anything else is a failure.
          dotnet "$AGENTBOX" prerequisite validate --format text || [ $? -eq 3 ]
          dotnet "$AGENTBOX" prerequisite install --format json \
            | jq -e 'all(.[]; .action != "installed" and .action != "failed")' >/dev/null

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - id: pack
        run: |
          # Above any release, so it's the agentbox the container tests install wherever they'd
          # otherwise take nuget.org's.
          version="999.${{ github.run_number }}.${{ github.run_attempt }}"
          src/cli/build/pack.sh "$version" nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: agentbox-nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 3

  # The packed tool in containers, the way it will be used: the setup script in a bare Linux
  # container as root and in another vendor's devcontainer image as its non-root user (sudo), and
  # the published AgentBox image with outdated tools (the lab's "update without restarting").
  container:
    needs: [pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: setup-script
            image: ubuntu:24.04
            user: root
          # Pinned to 24.04 like the AgentBox image: "ubuntu" moves to new releases before
          # every upstream Feature supports them.
          - scenario: foreign-image
            image: mcr.microsoft.com/devcontainers/base:noble
            user: vscode
          - scenario: lab-update
            image: ghcr.io/talxis/tools-agentbox/image:latest
            user: root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agentbox-nupkg
          path: nupkg
      - name: ${{ matrix.scenario }}
        run: |
          docker run --rm --user "${{ matrix.user }}" \
            -v "$PWD/nupkg:/nupkg:ro" -v "$PWD:/repo:ro" \
            "${{ matrix.image }}" bash "/repo/test/cli/${{ matrix.scenario }}.sh"
