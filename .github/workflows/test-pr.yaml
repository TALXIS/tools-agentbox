name: "CI - Test Features & Templates"
on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pac-cli: ./**/pac-cli/**
            txc-cli: ./**/txc-cli/**
            keyring: ./**/keyring/**
            pa-cli: ./**/pa-cli/**
            agentbox:
              - ./**/agentbox/**
              - ./src/cli/**
            power-platform:
              - ./**/power-platform/**
              - ./src/container/scripts/**

  test-features:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: ${{ fromJSON(needs.detect-changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4

      # The image test packs the CLI from this checkout.
      - uses: actions/setup-dotnet@v4
        if: matrix.feature == 'power-platform'
        with:
          dotnet-version: "10.0.x"

      - name: Smoke test '${{ matrix.feature }}'
        uses: ./.github/actions/smoke-test
        with:
          feature: "${{ matrix.feature }}"
