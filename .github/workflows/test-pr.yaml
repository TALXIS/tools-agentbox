name: "CI - Test Features & Templates"
on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            pac-cli: ./**/pac-cli/**
            txc-cli: ./**/txc-cli/**
            keyring: ./**/keyring/**
            pa-cli: ./**/pa-cli/**
            agentbox:
              - ./**/agentbox/**
              - ./src/cli/**
            power-platform:
              - ./**/power-platform/**
              - ./src/container/scripts/**
              - ./src/container/agentbox-features.json

  test-features:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One Feature failing says nothing about the others.
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect-changes.outputs.features) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The image test packs the CLI from this checkout.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.feature == 'power-platform'
        with:
          dotnet-version: "10.0.x"

      - name: Smoke test '${{ matrix.feature }}'
        uses: ./.github/actions/smoke-test
        with:
          feature: "${{ matrix.feature }}"
