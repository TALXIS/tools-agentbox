name: "CI - Test Features & Templates"
on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            pac-cli: ./**/pac-cli/**
            txc-cli: ./**/txc-cli/**
            keyring: ./**/keyring/**
            git-credential-manager:
              - ./**/git-credential-manager/**
              - ./**/keyring/**
            pa-cli: ./**/pa-cli/**
            playwright-cli: ./**/playwright-cli/**
            agentbox:
              - ./**/agentbox/**
              - ./src/cli/**
            power-platform:
              - ./**/power-platform/**
              - ./src/cli/**
              - ./src/container/features/**
              - ./src/container/scripts/**
              - ./src/container/agentbox-features.json
              - ./.dockerignore

  test-features:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One Feature failing says nothing about the others.
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.detect-changes.outputs.features) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Smoke test '${{ matrix.feature }}'
        uses: ./.github/actions/smoke-test
        with:
          feature: "${{ matrix.feature }}"
