name: publish-templates
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/container/templates/**"
  release:
    types: [published]

jobs:
  # Keeps generated README.md docs in sync with each Template's manifest - not a publish (nothing
  # reaches GHCR here), so this stays push-triggered rather than waiting on a release.
  docs:
    if: ${{ github.event_name != 'release' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: "Generate Documentation"
        uses: devcontainers/action@v1
        with:
          publish-templates: "false"
          base-path-to-templates: "./src/container/templates"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR for Documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config pull.rebase false

          branch="automated-docs-templates-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          message="Automated documentation update (templates)"

          git add src/container/templates/**/README.md 2>/dev/null || true
          git commit -m "Automated documentation update [skip ci]" || export NO_UPDATES=true

          if [ "$NO_UPDATES" != "true" ]; then
            git push origin "$branch"
            gh pr create --title "$message" --body "$message"
          fi

  # Publishing only ever happens because a human cut a GitHub Release - matches
  # tools-cli/tools-devkit-templates/tools-devkit-build's convention. Every Template is published under
  # the release's version (the same number as the image), not the "version" in its manifest: that
  # field is overwritten here, so the repo's copy doesn't need bumping. Unchanged Templates are
  # republished with identical content. A major release moves every Template to a new major tag,
  # so references to the old one (":1") must be updated in the same change.
  publish:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-version
        with:
          set-in: "./src/container/templates/*/devcontainer-template.json"

      - name: "Publish Templates"
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src/container/templates"
          generate-docs: "false"
          # The release tag (vX.Y.Z) already records what was published.
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
